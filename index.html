<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mock Media API</title>
  </head>
  <body>
    <h1>Welcome to the Mock Media API</h1>
    <p>
      This API allows you to manage Movies, Series, and Songs using HTTP
      methods:
    </p>
    <ul>
      <li><strong>GET /movies</strong> - List all movies</li>
      <li><strong>POST /movies</strong> - Add a new movie</li>
      <li><strong>PUT /movies</strong> - Update a movie by ID</li>
      <li><strong>DELETE /movies</strong> - Delete a movie by ID</li>
      <!-- Repeat for series and songs -->
    </ul>
  </body>
</html>
